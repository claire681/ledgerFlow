version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== DEBUG: Check RunPayroll ==="
        - grep -c "Additional hours" frontend/src/pages/RunPayroll.js || echo "GREP FAILED"
        - git log --oneline -1
        - cd frontend
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/build
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
