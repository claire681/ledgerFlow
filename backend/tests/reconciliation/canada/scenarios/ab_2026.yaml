# Alberta 2026 payroll reconciliation scenarios
# All scenarios verified against CRA PDOC (Payroll Deductions Online Calculator)
# https://www.canada.ca/en/revenue-agency/services/e-services/e-services-businesses/payroll-deductions-online-calculator.html
#
# Adding a new scenario:
# 1. Enter the employee data into CRA PDOC
# 2. Record the exact numbers CRA returns
# 3. Copy an existing scenario pattern below, fill in real values
# 4. Set reconciled_date to today, reconciled_by to your name
# 5. Run: pytest tests/reconciliation/canada/test_alberta_reconciliation.py -v
# 6. If tests pass, commit. If not, debug Novala's engine.
#
# Note on employee fields:
#   The current Canadian payroll engine does not use employee.age or
#   employee.marital_status directly - they're required framework fields for
#   future use (e.g. CPP over-65 rules, marital-status-based credits).
#   Use age=35 and marital_status=single as defaults if not relevant.

scenarios:

  # ==========================================================================
  # AB_1_LOW - $22/hr x 80hrs biweekly, low income bracket
  # ==========================================================================
  - id: ab_2026_low_income_biweekly
    jurisdiction: CA-AB
    tax_year: 2026
    reconciled_against: CRA_PDOC
    reconciled_date: 2026-07-18
    reconciled_by: Claire (BrightCare)
    notes: >
      BrightCare Claire baseline. $22/hr x 80 hrs biweekly = $1760/pay,
      low income bracket. Base CPP + BPA credit only, no CPP2 trigger.
    employee:
      age: 35
      marital_status: single
    income:
      gross_per_period: 1760.00
      pay_frequency: biweekly
      pay_periods_per_year: 26
    country_specific:
      td1_federal_claim: 16452.00
      td1_provincial_claim: 22769.00
      cpp_exempt: false
      ei_exempt: false
      additional_withholding: 0.00
    ytd_at_start:
      pensionable_earnings: 0.00
      insurable_earnings: 0.00
      cpp_base_paid: 0.00
      ei_paid: 0.00
    expected:
      cpp: 96.71
      cpp2: 0.00
      ei: 28.69
      federal_tax: 132.17
      provincial_tax: 60.71
      net_pay: 1441.72

