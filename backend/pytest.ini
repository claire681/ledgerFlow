[pytest]
# Novala test configuration
# Discovered locations for tests
testpaths =
    tests
    app

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Report style
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short

# Warnings treated as errors (surface deprecation early)
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Markers (add here when introduced)
markers =
    reconciliation: Reconciliation tests against official calculators
    slow: Tests that take >1 second
    integration: Tests requiring external services
